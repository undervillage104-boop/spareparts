<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予備品管理</title>
<style>
  :root{
    --bg:#121212; --surface:#1c1c1e; --surface2:#242426;
    --border:#333336; --text:#f2f2f2; --text-muted:#9a9a9e;
    --blue-bg:#17304f; --blue-fg:#7fb2ff;
    --red-bg:#4a1d1d; --red-fg:#ff8a8a;
    --amber-bg:#4a3a12; --amber-fg:#ffc868;
    --green-bg:#143d2a; --green-fg:#7ee0a0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .layout{display:flex; min-height:100vh;}

  /* ---- 左メニュー ---- */
  .side{width:210px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:14px 10px; display:flex; flex-direction:column; gap:2px;}
  .side.hide{display:none;}
  .brand{font-weight:600; font-size:15px; padding:4px 10px 12px;}
  .nav{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:none; border-radius:8px; cursor:pointer; background:transparent; color:var(--text); font-size:14px; text-align:left;}
  .nav:hover{background:var(--surface2);}
  .nav.on{background:var(--surface2); font-weight:600;}
  .nav .ic{width:20px; text-align:center;}
  .nav .soon{margin-left:auto; font-size:10px; color:var(--text-muted);}
  .who{margin-top:auto; font-size:12px; color:var(--text-muted); padding:10px; border-top:1px solid var(--border); line-height:1.8;}
  .linkbtn{background:none; border:none; color:var(--blue-fg); cursor:pointer; font-size:12px; padding:0;}

  /* ---- 本体 ---- */
  .content{flex:1; min-width:0;}
  .topbar{display:flex; align-items:center; gap:10px; padding:10px 16px;}
  .menu-btn{width:38px; height:38px; border:1px solid var(--border); background:var(--surface2); color:var(--text); border-radius:10px; font-size:18px; cursor:pointer;}
  .page{max-width:560px; margin:0 auto; padding:4px 16px 40px;}
  h1{font-size:18px; font-weight:600; margin:4px 0 12px;}
  h2{font-size:15px; font-weight:600; margin:24px 0 8px;}
  .scrim{display:none;}
  .note{font-size:13px; color:var(--text-muted); line-height:1.6; margin:0 0 8px;}
  .muted{font-size:12px; color:var(--text-muted); margin:0;}

  /* ---- 共通の部品 ---- */
  input[type="text"],input[type="password"],input[type="number"],input[type="date"],select{
    background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; color:var(--text); font-size:16px; min-width:0;
  }
  input[type="text"]{flex:1;}
  input::placeholder{color:var(--text-muted);}
  .btn{padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer; font-size:14px;}
  .btn.primary{background:var(--blue-bg); color:var(--blue-fg); border-color:var(--blue-fg); font-weight:600;}
  .btn.mini{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.4; cursor:default;}
  .row{display:flex; gap:8px; align-items:center;}
  .seg{display:flex; gap:8px; margin-top:10px;}
  .seg .btn{flex:1;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .badge.standard{background:var(--blue-bg); color:var(--blue-fg);}
  .badge.special{background:var(--red-bg); color:var(--red-fg);}
  .badge.processed{background:var(--amber-bg); color:var(--amber-fg);}
  .badge.other,.badge.rev{background:var(--surface2); color:var(--text-muted);}
  .badge.in{background:var(--green-bg); color:var(--green-fg);}
  .badge.out{background:var(--red-bg); color:var(--red-fg);}
  .unset{font-size:10px; padding:2px 8px; border-radius:999px; background:var(--amber-bg); color:var(--amber-fg);}
  .warn{font-size:13px; color:var(--red-fg); margin:8px 0 0;}
  .okmsg{font-size:13px; color:var(--green-fg); margin:8px 0 0;}
  .foot{position:sticky; bottom:0; display:flex; justify-content:flex-end; gap:8px; padding:12px 0; margin-top:16px; background:var(--bg);}

  /* ---- ホーム ---- */
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .stat .sl{font-size:12px; color:var(--text-muted); margin:0;}
  .stat .sv{font-size:24px; font-weight:600; margin:4px 0 0;}
  .box{background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:18px 14px; font-size:13px; color:var(--text-muted); line-height:1.7;}

  /* ---- ログイン ---- */
  .form label{display:block; font-size:13px; margin:14px 0 4px;}
  .form input{width:100%;}
  .err{color:var(--red-fg); font-size:13px; min-height:20px; margin:10px 0 0;}

  /* ---- 検索 ---- */
  .search-row{display:flex; gap:8px; margin-bottom:8px;}
  button.scan-btn{width:44px; border:1px solid var(--border); background:var(--surface2); border-radius:10px; color:var(--text); font-size:20px; cursor:pointer;}
  .count{font-size:12px; color:var(--text-muted); margin:0 2px 10px; min-height:18px;}
  .status{font-size:14px; color:var(--text-muted); text-align:center; padding:28px 0;}
  .card-top{display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .top-left{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .id-text,.loc-text{font-size:12px; color:var(--text-muted);}
  .qr-box{width:36px; height:36px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .name{font-weight:600; font-size:15px; margin:9px 0 2px; line-height:1.35;}
  .model{font-size:12px; color:var(--text-muted); margin:0 0 2px; line-height:1.4; word-break:break-all;}
  .maker{font-size:12px; color:var(--text-muted); margin:0 0 9px;}
  .bottom-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-muted); gap:8px;}
  button.more{display:block; width:100%; padding:12px; margin:6px 0 20px; font-size:14px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; cursor:pointer;}
  #scanner{display:none; margin-bottom:12px;}
  #reader{width:100%; border-radius:10px; overflow:hidden;}

  /* ---- 入出庫・履歴 ---- */
  .field{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .field .lbl{width:38px; font-size:14px;}
  .field .cur{margin-left:auto; font-size:12px; color:var(--text-muted);}
  .stepbtn{width:38px; padding:8px 0;}
  .numin{width:72px; text-align:center; font-weight:600; padding:8px 4px !important;}
  .eqbox{margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
  .sel2{display:flex; gap:8px; margin-top:8px;}
  .sel2 select{flex:1;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{font-size:12px; padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer;}
  .line-item{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; padding:8px 0; border-top:1px solid var(--border);}
  .line-item:first-child{border-top:none;}
  .tot{display:flex; justify-content:space-between; font-size:14px; margin-top:6px;}
  .hrow{padding:12px 0; border-top:1px solid var(--border);}
  .hrow:first-child{border-top:none;}
  .dim{opacity:.55;}
  .strike{text-decoration:line-through;}
  .panel{margin-top:8px; padding:10px; border:1px solid var(--border); border-radius:10px;}

  /* ---- 発注管理 ---- */
  .chiprow{display:flex; gap:6px; margin-top:10px; overflow-x:auto;}
  .chip.on{background:var(--blue-bg); color:var(--blue-fg); border-color:var(--blue-fg); font-weight:600;}
  .osec{display:flex; align-items:baseline; gap:8px; margin:18px 0 8px;}
  .osec b{font-size:14px; font-weight:600;}
  .ogrid3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .ogrid2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .otile{position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .otile.standard{background:var(--blue-bg); color:var(--blue-fg);}
  .otile.special{background:var(--red-bg); color:var(--red-fg);}
  .otile.processed{background:var(--amber-bg); color:var(--amber-fg);}
  .otile.other{background:var(--surface2); color:var(--text-muted);}
  .otile.done{opacity:.5;}
  .otile.late{outline:2px solid #d93636;}
  .otile .ph{font-size:26px; opacity:.5;}
  .ocap{position:absolute; left:0; right:0; bottom:0; padding:16px 6px 5px; background:linear-gradient(transparent,rgba(0,0,0,.7)); color:#fff; font-size:11px; line-height:1.25;}
  .ocap span{display:block; opacity:.8; font-size:10px; margin-top:1px;}
  .ost{position:absolute; top:5px; left:5px; font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid;}
  .ost.todo{background:var(--amber-bg); color:var(--amber-fg);}
  .ost.ordering{background:var(--blue-bg); color:var(--blue-fg);}
  .ost.done{background:var(--green-bg); color:var(--green-fg);}
  .olate{position:absolute; top:5px; right:5px; font-size:10px; padding:2px 7px; border-radius:999px; background:#d93636; color:#fff; font-weight:600;}
  .sheetwrap{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:flex; align-items:flex-end; justify-content:center;}
  .osheet{width:100%; max-width:560px; background:var(--surface); border-radius:16px 16px 0 0; padding:16px; border-top:1px solid var(--border); max-height:90vh; overflow:auto;}
  .kv{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:7px 0; border-top:1px solid var(--border);}
  .kv span:first-child{color:var(--text-muted); white-space:nowrap;}
  .kv span:last-child{text-align:right;}
  .fld{margin-top:12px;}
  .fld label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:4px;}
  .fld input{width:100%;}

  @media (max-width:720px){
    .side{position:fixed; z-index:20; top:0; bottom:0; left:0; padding-top:calc(14px + env(safe-area-inset-top,0px));}
    .scrim{display:block; position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.5);}
    .scrim.hide{display:none;}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side"></aside>
  <div class="scrim hide" id="scrim"></div>
  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" title="メニューを開閉">☰</button>
      <span id="crumb" style="font-size:13px;color:var(--text-muted);"></span>
    </div>
    <main class="page" id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const supabaseClient = window.supabase.createClient(
  "https://tladtthdeuhunylosnhb.supabase.co",
  "sb_publishable_ukRGWsj1KIN_TEoV2SIAhQ_1HkqV70l"
);

/* ===== 共通 ===== */
const TOKEN_KEY = "spare_token";
const ROUTES = [
  ["home",  "ホーム",   "⌂", false],
  ["search","検索",     "⌕", false],
  ["io",    "入出庫",   "⇄", false],
  ["hist",  "履歴",     "◷", false],
  ["order", "発注管理", "▤", false]
];
let route = "home";
let sideOpen = window.innerWidth > 720;
let me = null;        // ログイン中の人 {user_id, user_name}
let masters = null;   // ライン・設備のマスタ

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const getToken = () => localStorage.getItem(TOKEN_KEY);
const mainEl = () => document.getElementById("main");

/* ===== メニュー ===== */
function renderSide(){
  const side = document.getElementById("side");
  side.className = "side" + (sideOpen ? "" : " hide");
  const who = me
    ? `ログイン中: ${esc(me.user_name)}さん<br><button class="linkbtn" id="logoutBtn">ログアウト</button>`
    : `<button class="linkbtn" id="loginLink">ログイン</button>`;
  side.innerHTML = `<div class="brand">予備品管理</div>` +
    ROUTES.map(r => `<button class="nav ${route===r[0]?'on':''}" data-route="${r[0]}">
      <span class="ic">${r[2]}</span>${r[1]}${r[3] ? '<span class="soon">準備中</span>' : ''}</button>`).join("") +
    `<div class="who">${who}</div>`;
  side.querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => {
    location.hash = b.dataset.route;
    if(window.innerWidth <= 720){ sideOpen = false; renderSide(); renderScrim(); }
  }));
  const lo = document.getElementById("logoutBtn");
  if(lo) lo.addEventListener("click", logout);
  const li = document.getElementById("loginLink");
  if(li) li.addEventListener("click", () => { location.hash = "io"; if(route === "io") go(); });
}
function renderScrim(){
  document.getElementById("scrim").className = "scrim" + (sideOpen && window.innerWidth <= 720 ? "" : " hide");
}
document.getElementById("menuBtn").addEventListener("click", () => { sideOpen = !sideOpen; renderSide(); renderScrim(); });
document.getElementById("scrim").addEventListener("click", () => { sideOpen = false; renderSide(); renderScrim(); });

async function go(){
  const r = location.hash.replace("#", "");
  route = ROUTES.some(x => x[0] === r) ? r : "home";
  stopScan();
  renderSide(); renderScrim();
  document.getElementById("crumb").textContent = ROUTES.find(x => x[0] === route)[1];
  const main = mainEl();
  if(route === "home") renderHome(main);
  else if(route === "search") renderSearch(main);
  else {
    if(!me){ renderLogin(main); return; }
    await loadMasters();
    if(location.hash.replace("#", "") !== route) return;   // 読み込み中に別の画面へ移った
    if(route === "io") renderIo(); else if(route === "hist") hLoad(); else oLoad();
  }
}
window.addEventListener("hashchange", go);

/* ===== ログイン ===== */
async function loadMe(){
  const t = getToken();
  me = null;
  if(!t) return;
  const { data, error } = await supabaseClient.rpc("app_me", { p_token: t });
  if(!error && data && data.ok) me = { user_id: data.user_id, user_name: data.user_name };
  else localStorage.removeItem(TOKEN_KEY);
}
function renderLogin(main, note){
  main.innerHTML = `
    <h1>ログイン</h1>
    <p class="note">${esc(note || "入出庫・履歴・発注管理は、ログインして使います。")}</p>
    <div class="form">
      <label>社員コード</label>
      <input id="lcode" type="text" inputmode="numeric" autocomplete="username">
      <label>パスコード(4桁)</label>
      <input id="lpass" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
      <div style="margin-top:16px;"><button class="btn primary" id="lgo" style="width:100%;">ログイン</button></div>
      <p class="err" id="lerr"></p>
    </div>`;
  const submit = async () => {
    const code = document.getElementById("lcode").value.trim();
    const pass = document.getElementById("lpass").value;
    const err = document.getElementById("lerr");
    if(!code || !pass){ err.textContent = "社員コードとパスコードを入力してください"; return; }
    err.textContent = "確認中…";
    const { data, error } = await supabaseClient.rpc("app_login", { p_code: code, p_pass: pass });
    if(error || !data){ err.textContent = "ログインできませんでした。" + (error ? error.message : ""); return; }
    if(!data.ok){ err.textContent = data.message || "ログインできませんでした"; return; }
    localStorage.setItem(TOKEN_KEY, data.token);
    me = { user_id: data.user_id, user_name: data.user_name };
    go();
  };
  document.getElementById("lgo").addEventListener("click", submit);
  document.getElementById("lpass").addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
}
function logout(){
  localStorage.removeItem(TOKEN_KEY);
  me = null;
  go();
}
function onLoginExpired(){
  localStorage.removeItem(TOKEN_KEY);
  me = null;
  renderSide();
  renderLogin(mainEl(), "ログインの有効期限が切れました。もう一度ログインしてください。");
}

/* ===== ライン・設備のマスタ ===== */
async function loadMasters(){
  if(masters) return masters;
  const [l, e] = await Promise.all([
    supabaseClient.from("prod_lines").select("line_id,line_name").eq("is_active", true).order("line_name"),
    supabaseClient.from("line_equipments").select("line_equipment_id,line_id,equipment_name").eq("is_active", true).order("equipment_name")
  ]);
  const result = { lines: l.data || [], eqs: e.data || [] };
  if(!l.error && !e.error) masters = result;   // 取得できたときだけ覚えておく
  return result.lines ? result : { lines: [], eqs: [] };
}
const M = () => masters || { lines: [], eqs: [] };
const lineOpts = sel => '<option value="">ライン</option>' + M().lines.map(l =>
  `<option value="${l.line_id}" ${String(l.line_id)===String(sel)?'selected':''}>${esc(l.line_name)}</option>`).join("");
const eqOpts = (lineId, sel) => {
  const list = lineId ? M().eqs.filter(e => String(e.line_id) === String(lineId)) : [];
  return '<option value="">設備</option>' + list.map(e =>
    `<option value="${e.line_equipment_id}" ${String(e.line_equipment_id)===String(sel)?'selected':''}>${esc(e.equipment_name)}</option>`).join("");
};
const lineName = id => (M().lines.find(l => String(l.line_id) === String(id)) || {}).line_name || "";
const eqName = id => (M().eqs.find(e => String(e.line_equipment_id) === String(id)) || {}).equipment_name || "";
const whereText = (lid, eid) => [lineName(lid), eqName(eid)].filter(Boolean).join(" / ");

/* ===== ホーム ===== */
async function renderHome(main){
  main.innerHTML = `
    <h1>ホーム</h1>
    <div class="stat"><p class="sl">登録されている部品(品名あり)</p><p class="sv" id="partCount">…</p></div>
    <h2>よく使われている部品</h2>
    <div class="box">入出庫の記録がたまると、ここに、出庫が多い順のランキング(部品別・メンバー別)が出ます。</div>
    <h2>動いていない在庫</h2>
    <div class="box">在庫があるのに、長く出庫がない部品と、その在庫金額が出ます。<br>入出庫の記録を始めた日からの集計になります。</div>`;
  const { count, error } = await supabaseClient
    .from("parts").select("part_id", { count: "exact", head: true }).not("part_name", "is", null);
  const el = document.getElementById("partCount");
  if(el) el.textContent = error ? "取得できません" : (count ?? 0).toLocaleString() + "件";
}

/* ===== 検索(実データ) ===== */
const PAGE_SIZE = 30;
let currentTerm = "", currentPage = 0, requestToken = 0, qr = null, searchTimer = null;

const KANA_FULL = [..."ァアィイゥウェエォオカガキギクグケゲコゴサザシジスズセゼソゾタダチヂッツヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモャヤュユョヨラリルレロヮワヲンヴー"];
const KANA_HALF = "ｧ ｱ ｨ ｲ ｩ ｳ ｪ ｴ ｫ ｵ ｶ ｶﾞ ｷ ｷﾞ ｸ ｸﾞ ｹ ｹﾞ ｺ ｺﾞ ｻ ｻﾞ ｼ ｼﾞ ｽ ｽﾞ ｾ ｾﾞ ｿ ｿﾞ ﾀ ﾀﾞ ﾁ ﾁﾞ ｯ ﾂ ﾂﾞ ﾃ ﾃﾞ ﾄ ﾄﾞ ﾅ ﾆ ﾇ ﾈ ﾉ ﾊ ﾊﾞ ﾊﾟ ﾋ ﾋﾞ ﾋﾟ ﾌ ﾌﾞ ﾌﾟ ﾍ ﾍﾞ ﾍﾟ ﾎ ﾎﾞ ﾎﾟ ﾏ ﾐ ﾑ ﾒ ﾓ ｬ ﾔ ｭ ﾕ ｮ ﾖ ﾗ ﾘ ﾙ ﾚ ﾛ ﾜ ﾜ ｦ ﾝ ｳﾞ ｰ".split(" ");
const KANA_MAP = {};
KANA_FULL.forEach((c, i) => { KANA_MAP[c] = KANA_HALF[i]; });
const toAscii = s => s.replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, " ");
const toHalfKana = s => [...s].map(c => KANA_MAP[c] ?? c).join("");
const sanitize = s => s.replace(/[,()"\\*%]/g, "");

function wordFilter(word){
  const base = sanitize(toAscii(word));
  const variants = [...new Set([base, toHalfKana(base)])].filter(Boolean);
  const conds = [];
  variants.forEach(v => { conds.push(`part_name.ilike.*${v}*`); conds.push(`model_number.ilike.*${v}*`); });
  if(/^\d+$/.test(base)) conds.push(`part_id.eq.${base}`);
  return conds.join(",");
}
function classify(k){
  if(!k) return "other";
  if(k.includes("加工")) return "processed";
  if(k.includes("特殊")) return "special";
  if(k.includes("標準")) return "standard";
  return "other";
}

async function search(term, page){
  const token = ++requestToken;
  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const moreBtn = document.getElementById("moreBtn");
  if(!listEl) return;
  if(page === 0){ listEl.innerHTML = '<p class="status">検索中…</p>'; moreBtn.style.display = "none"; }

  let q = supabaseClient.from("parts").select(`
      part_id, part_name, model_number, order_point, order_quantity,
      maker:makers ( maker_name ),
      kanban_type:kanban_types ( kanban_type_name ),
      supplier:suppliers ( supplier_name ),
      storage_location:storage_locations ( storage_location_name )
    `, { count: "exact" }).not("part_name", "is", null);

  term.split(/\s+/).filter(Boolean).forEach(w => { const f = wordFilter(w); if(f) q = q.or(f); });

  const from = page * PAGE_SIZE;
  const { data, error, count } = await q.order("part_id").range(from, from + PAGE_SIZE - 1);
  if(token !== requestToken || !document.getElementById("list")) return;

  if(error){
    listEl.innerHTML = `<p class="status">検索に失敗しました。<br>${esc(error.message)}</p>`;
    countEl.textContent = ""; return;
  }
  if(page === 0) listEl.innerHTML = "";
  if(count === 0){ listEl.innerHTML = '<p class="status">該当する部品がありません</p>'; countEl.textContent = "0件"; return; }

  listEl.insertAdjacentHTML("beforeend", data.map(cardHtml).join(""));
  const shown = from + data.length;
  countEl.textContent = `${count.toLocaleString()}件中 ${shown.toLocaleString()}件を表示`;
  moreBtn.style.display = shown < count ? "block" : "none";
  currentPage = page;
}

async function stopScan(){
  if(qr){ try{ await qr.stop(); }catch(e){} qr = null; }
  const sc = document.getElementById("scanner");
  if(sc) sc.style.display = "none";
}

function renderSearch(main){
  currentTerm = ""; currentPage = 0;
  main.innerHTML = `
    <h1>部品検索</h1>
    <div class="search-row">
      <input id="q" type="text" placeholder="品名・型式・IDで検索(スペースで複数語)" autocomplete="off">
      <button class="scan-btn" id="scanBtn" title="QRコードを読み取る">▦</button>
    </div>
    <div id="scanner"><div id="reader"></div><button class="btn mini" style="margin-top:8px;" id="closeScan">閉じる</button></div>
    <p class="count" id="count"></p>
    <div id="list"></div>
    <button class="more" id="moreBtn" style="display:none">さらに表示</button>`;

  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentTerm = e.target.value.trim(); search(currentTerm, 0); }, 300);
  });
  document.getElementById("moreBtn").addEventListener("click", () => search(currentTerm, currentPage + 1));

const PART_SEL = `part_id, part_name, model_number, new_stock_qty, used_stock_qty,
  maker:makers ( maker_name ),
  kanban_type:kanban_types ( kanban_type_name ),
  storage_location:storage_locations ( storage_location_name )`;

let io = { q:"", found:null, cands:null, msg:"", msgOk:true, type:"out", nq:0, uq:0, lineId:"", eqId:"", cart:[], view:"main", busy:false, err:"" };
const typeLabel = t => t === "in" ? "入庫" : "出庫";
function ioFresh(){ io.found = null; io.cands = null; io.type = "out"; io.nq = 0; io.uq = 0; io.lineId = ""; io.eqId = ""; }

const recentKey = () => "recent_" + me.user_id;
function getRecent(){ try{ return JSON.parse(localStorage.getItem(recentKey()) || "[]"); }catch(e){ return []; } }
function pushRecent(lineId, eqId){
  const r = getRecent().filter(x => String(x.eqId) !== String(eqId));
  r.unshift({ lineId, eqId });
  localStorage.setItem(recentKey(), JSON.stringify(r.slice(0, 3)));
}

async function ioSearch(){
  const term = io.q.trim();
  io.msg = ""; io.err = "";
  if(!term){ renderIo(); return; }
  ioFresh();
  if(/^\d+$/.test(term)){
    const { data, error } = await supabaseClient.from("parts").select(PART_SEL).eq("part_id", Number(term)).maybeSingle();
    if(error){ io.msg = "検索に失敗しました: " + error.message; io.msgOk = false; }
    else if(!data || !data.part_name){ io.msg = "該当する部品がありません"; io.msgOk = false; }
    else io.found = data;
  }else{
    let q = supabaseClient.from("parts").select(PART_SEL).not("part_name", "is", null);
    term.split(/\s+/).filter(Boolean).forEach(w => { const f = wordFilter(w); if(f) q = q.or(f); });
    const { data, error } = await q.order("part_id").limit(10);
    if(error){ io.msg = "検索に失敗しました: " + error.message; io.msgOk = false; }
    else if(!data.length){ io.msg = "該当する部品がありません"; io.msgOk = false; }
    else io.cands = data;
  }
  renderIo();
}
function ioPick(i){ io.found = io.cands[i]; io.cands = null; renderIo(); }
function ioSetType(t){ io.type = t; renderIo(); }
function ioChg(k, d){ if(k === "n") io.nq = Math.max(0, io.nq + d); else io.uq = Math.max(0, io.uq + d); renderIo(); }
function ioTyped(k, v){ const x = Math.max(0, parseInt(v, 10) || 0); if(k === "n") io.nq = x; else io.uq = x; ioUpdateAdd(); }
function ioSetLine(v){ io.lineId = v; io.eqId = ""; renderIo(); }
function ioSetEq(v){ io.eqId = v; renderIo(); }
function ioRecent(i){ const r = getRecent()[i]; io.lineId = r.lineId; io.eqId = r.eqId; renderIo(); }
function ioOver(){ return io.type === "out" && io.found && (io.nq > io.found.new_stock_qty || io.uq > io.found.used_stock_qty); }
function ioUpdateAdd(){
  const b = document.getElementById("addBtn"), w = document.getElementById("overWarn");
  if(!b) return;
  const bad = ioOver();
  b.disabled = bad || io.nq + io.uq === 0;
  w.style.display = bad ? "block" : "none";
}
function ioAdd(){
  const p = io.found, isOut = io.type === "out";
  const lid = isOut ? io.lineId : "", eid = isOut ? io.eqId : "";
  if(isOut && eid) pushRecent(lid, eid);
  io.cart.push({ part_id: p.part_id, name: p.part_name, type: io.type, nq: io.nq, uq: io.uq, lineId: lid, eqId: eid, stockN: p.new_stock_qty, stockU: p.used_stock_qty });
  io.q = ""; ioFresh(); io.msg = "追加しました。続けて読み取れます。"; io.msgOk = true;
  renderIo();
}
function ioRm(i){ io.cart.splice(i, 1); renderIo(); }
function ioGoConfirm(){ io.view = "confirm"; io.err = ""; renderIo(); }
function ioBack(){ io.view = "main"; io.err = ""; renderIo(); }
function ioAgain(){ io.cart = []; io.view = "main"; io.msg = ""; io.err = ""; renderIo(); }
function ioStockAfter(){
  const st = {};
  return io.cart.map(c => {
    if(!st[c.part_id]) st[c.part_id] = { n: c.stockN, u: c.stockU };
    const s = st[c.part_id], sg = c.type === "in" ? 1 : -1;
    const before = { n: s.n, u: s.u };
    s.n += sg * c.nq; s.u += sg * c.uq;
    return { c, before, after: { n: s.n, u: s.u } };
  });
}
async function ioCommit(){
  if(io.busy) return;
  io.busy = true; io.err = ""; renderIo();
  const items = io.cart.map(c => ({
    part_id: c.part_id, type: typeLabel(c.type), new_qty: c.nq, used_qty: c.uq,
    line_id: c.lineId ? Number(c.lineId) : null, line_equipment_id: c.eqId ? Number(c.eqId) : null
  }));
  const { data, error } = await supabaseClient.rpc("app_record_movements", { p_token: getToken(), p_items: items });
  io.busy = false;
  if(error || !data || !data.ok){
    const m = (data && data.message) || (error && error.message) || "登録に失敗しました";
    if(m.includes("ログインし直して")){ onLoginExpired(); return; }
    io.err = m; renderIo(); return;
  }
  io.view = "done"; renderIo();
}
async function ioScan(){

const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const dayStart = off => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + off); return d; };
let h = { period:"today", from:ymd(dayStart(-29)), to:ymd(dayStart(0)), mine:false, askCancel:null, fillId:null, fl:"", fe:"", msg:"", msgOk:true, rows:[], loading:false, error:"" };

function hRange(){
  const p = h.period;
  if(p === "today") return [dayStart(0), dayStart(1)];
  if(p === "yesterday") return [dayStart(-1), dayStart(0)];
  if(p === "week") return [dayStart(-6), dayStart(1)];
  if(p === "month") return [dayStart(-29), dayStart(1)];
  const f = new Date(h.from + "T00:00:00"), t = new Date(h.to + "T00:00:00");
  t.setDate(t.getDate() + 1);
  return [f, t];
}
async function hLoad(){
  h.loading = true; h.error = ""; renderHist();
  const [a, b] = hRange();
  let q = supabaseClient.from("stock_movements").select(`
      movement_id, movement_type, new_qty, used_qty, movement_at, is_cancelled, reverses_movement_id,
      part_id, processed_by_id, line_id, line_equipment_id,
      part:parts ( part_name ),
      staff:users ( user_name ),
      line:prod_lines ( line_name ),
      equipment:line_equipments ( equipment_name )
    `).gte("movement_at", a.toISOString()).lt("movement_at", b.toISOString())
    .order("movement_at", { ascending: false }).limit(300);
  if(h.mine) q = q.eq("processed_by_id", me.user_id);
  const { data, error } = await q;
  h.loading = false;
  if(error){ h.error = error.message; h.rows = []; } else h.rows = data;
  renderHist();
}
function hSetPeriod(v){ h.period = v; hLoad(); }
function hSetMine(){ h.mine = !h.mine; hLoad(); }
function hSetDate(k, v){ h[k] = v; hLoad(); }
function hAskCancel(id){ h.askCancel = id; h.fillId = null; h.msg = ""; renderHist(); }
function hNoCancel(){ h.askCancel = null; renderHist(); }
async function hRpc(name, args, okMsg){
  const { data, error } = await supabaseClient.rpc(name, { p_token: getToken(), ...args });
  if(error || !data || !data.ok){
    const m = (data && data.message) || (error && error.message) || "失敗しました";
    if(m.includes("ログインし直して")){ onLoginExpired(); return; }
    h.msg = m; h.msgOk = false;
  }else{ h.msg = okMsg; h.msgOk = true; }
  h.askCancel = null; h.fillId = null;
  await hLoad();
}
function hDoCancel(id){ hRpc("app_cancel_movement", { p_movement_id: id }, "取り消しました。逆の入出庫が記録されました。"); }
function hOpenFill(id){ h.fillId = id; h.askCancel = null; h.fl = ""; h.fe = ""; h.msg = ""; renderHist(); }
function hFillLine(v){ h.fl = v; h.fe = ""; renderHist(); }
function hFillEq(v){ h.fe = v; renderHist(); }
function hNoFill(){ h.fillId = null; renderHist(); }
function hSaveFill(){
  hRpc("app_set_movement_equipment", { p_movement_id: h.fillId, p_line_id: h.fl ? Number(h.fl) : null, p_equipment_id: Number(h.fe) }, "設備を入力しました。");

  let x = `<div class="hrow ${r.is_cancelled ? "dim" : ""}"><div class="row">
    <span class="badge ${isRev ? "rev" : t}">${isRev ? "取り消し" : r.movement_type}</span>
    <span class="muted">${when}</span><span class="muted" style="margin-left:auto;">${esc(r.staff?.user_name || "")}さん</span></div>
    <p class="name ${r.is_cancelled ? "strike" : ""}">${esc(r.part?.part_name || "")}<span class="id-text"> (ID: ${r.part_id ?? ""})</span></p>
    <p class="muted">新品 ${r.new_qty}個 / 中古 ${r.used_qty}個　${where ? "設備: " + esc(where) : (t === "out" && !isRev ? '<span class="unset">設備未入力</span>' : "")}</p>`;
  if(isRev) x += `<p class="muted">元の記録(#${r.reverses_movement_id})を取り消した記録です</p>`;
  if(r.is_cancelled) x += `<p class="muted">取り消し済み</p>`;
  if((canCancel || canFill) && h.askCancel !== r.movement_id && h.fillId !== r.movement_id){
    x += `<div class="row" style="margin-top:8px;">${canFill ? `<button class="btn mini" onclick="hOpenFill(${r.movement_id})">設備を入力</button>` : ""}${canCancel ? `<button class="btn mini" onclick="hAskCancel(${r.movement_id})">取り消し</button>` : ""}</div>`;
  }
  if(h.askCancel === r.movement_id){
    x += `<div class="panel"><p class="muted" style="color:var(--text);">この記録を取り消しますか?<br>逆の入出庫が自動で記録され、在庫が元に戻ります。元の記録は残ります。</p>
      <div class="row" style="margin-top:10px;"><button class="btn mini" onclick="hNoCancel()">やめる</button><button class="btn mini primary" onclick="hDoCancel(${r.movement_id})">取り消す</button></div></div>`;
  }
  if(h.fillId === r.movement_id){
    x += `<div class="panel"><p class="muted">使用設備を入力(空欄の記録だけ入力できます)</p>
      <div class="sel2"><select onchange="hFillLine(this.value)">${lineOpts(h.fl)}</select><select onchange="hFillEq(this.value)" ${h.fl ? "" : "disabled"}>${eqOpts(h.fl, h.fe)}</select></div>
      <div class="row" style="margin-top:10px;"><button class="btn mini" onclick="hNoFill()">やめる</button><button class="btn mini primary" ${h.fe ? "" : "disabled"} onclick="hSaveFill()">保存</button></div></div>`;
  }
  return x + "</div>";
}
function renderHist(){
  if(route !== "hist") return;
  const eff = h.rows.filter(r => !r.reverses_movement_id && !r.is_cancelled);
  const o = eff.filter(r => r.movement_type === "出庫").length, i = eff.filter(r => r.movement_type === "入庫").length;
  let x = `<h1>入出庫の履歴</h1>
    <div class="row"><select id="hper" onchange="hSetPeriod(this.value)" style="flex:1;">
      ${[["today","今日"],["yesterday","昨日"],["week","今週(7日間)"],["month","今月(30日間)"],["custom","期間を指定"]].map(v => `<option value="${v[0]}" ${h.period === v[0] ? "selected" : ""}>${v[1]}</option>`).join("")}</select>
      <button class="btn ${h.mine ? "primary" : ""}" onclick="hSetMine()">自分の分のみ</button></div>`;
  if(h.period === "custom"){
    x += `<div class="row" style="margin-top:8px;"><input type="date" value="${h.from}" style="flex:1;" onchange="hSetDate('from',this.value)">
      <span class="muted">〜</span><input type="date" value="${h.to}" style="flex:1;" onchange="hSetDate('to',this.value)"></div>`;
  }
  x += `<p class="muted" style="margin-top:10px;">出庫 ${o}件 / 入庫 ${i}件(取り消しは除く)</p>`;
  if(h.msg) x += `<p class="${h.msgOk ? "okmsg" : "warn"}">${esc(h.msg)}</p>`;
  if(h.loading) x += `<p class="status">読み込み中…</p>`;
  else if(h.error) x += `<p class="status">読み込みに失敗しました。<br>${esc(h.error)}</p>`;
  else if(!h.rows.length) x += `<p class="status">この期間の記録はありません</p>`;
  else x += `<div class="card" style="padding-top:2px;padding-bottom:2px;margin-top:10px;">${h.rows.map(hRowHtml).join("")}</div>`;
  mainEl().innerHTML = x;
}

/* ===== 発注管理 ===== */
const mdate = d => (d.getMonth() + 1) + "/" + d.getDate();
const ORDER_SEL = `order_id, status, external_order_id, due_date, order_quantity, created_at, received_at,
  part:parts ( part_id, part_name, model_number, order_point, new_stock_qty, used_stock_qty,
    kanban_type:kanban_types ( kanban_type_name ),
    maker:makers ( maker_name ) ),
  source:stock_movements ( movement_at,
    staff:users ( user_name ),
    line:prod_lines ( line_name ),
    equipment:line_equipments ( equipment_name ) )`;
let o = { filter:"all", rows:[], loading:false, error:"", sel:null, idv:"", duev:"", msg:"", msgOk:true };
const OST = { "未発注":["todo","未発注"], "発注中":["ordering","発注中"], "発注済み":["done","発注済み"] };

async function oLoad(){
  o.loading = true; o.error = ""; renderOrders();
  const { data, error } = await supabaseClient.from("order_queue").select(ORDER_SEL)
    .neq("status", "取消").order("created_at", { ascending: false }).limit(300);
  o.loading = false;
  if(error){ o.error = error.message; o.rows = []; } else o.rows = data;
  renderOrders();
}
function oLate(r){
  if(r.status !== "発注中" || !r.due_date) return 0;
  const due = new Date(r.due_date + "T00:00:00"), t = dayStart(0);
  return due < t ? Math.round((t - due) / 864e5) : 0;
}
function oOutDate(r){ return r.source?.movement_at ? new Date(r.source.movement_at) : new Date(r.created_at); }
function oTile(r){
  const kind = r.part?.kanban_type?.kanban_type_name || "未分類";
  const ld = oLate(r), st = OST[r.status];
  return `<div class="otile ${classify(kind)} ${r.status === "発注済み" ? "done" : ""} ${ld ? "late" : ""}" onclick="oOpen(${r.order_id})">
    <span class="ph">🖼</span>
    <span class="ost ${st[0]}">${st[1]}</span>
    ${ld ? `<span class="olate">${ld}日遅れ</span>` : ""}
    <div class="ocap">${esc(r.part?.part_name || "")}<span>出庫 ${mdate(oOutDate(r))}</span></div></div>`;
}
function oOpen(id){
  const r = o.rows.find(x => x.order_id === id);
  o.sel = id; o.msg = ""; o.idv = r.external_order_id || "";
  o.duev = r.due_date || ymd(dayStart(14));
  renderOrders();
}
function oClose(){ o.sel = null; o.msg = ""; renderOrders(); }
function oSetFilter(f){ o.filter = f; renderOrders(); }
function oChkId(v){ o.idv = v; const b = document.getElementById("oGo"); if(b) b.disabled = !v.trim(); }
async function oRpc(name, args, okMsg){
  const { data, error } = await supabaseClient.rpc(name, { p_token: getToken(), ...args });
  if(error || !data || !data.ok){
    const m = (data && data.message) || (error && error.message) || "失敗しました";
    if(m.includes("ログインし直して")){ onLoginExpired(); return; }
    o.msg = m; o.msgOk = false; renderOrders(); return;
  }
  o.msg = okMsg; o.msgOk = true; o.sel = null;
  await oLoad();
}
function oStart(){ oRpc("app_start_order", { p_order_id: o.sel, p_external_id: o.idv.trim(), p_due: o.duev || null }, "発注中にしました。"); }
function oReceive(){ oRpc("app_receive_order", { p_order_id: o.sel }, "入荷を記録しました(発注済み)。"); }

function oSheetHtml(){
  const r = o.rows.find(x => x.order_id === o.sel);
  if(!r) return "";
  const kind = r.part?.kanban_type?.kanban_type_name || "未分類";
  const st = OST[r.status], ld = oLate(r);
  const where = [r.source?.line?.line_name, r.source?.equipment?.equipment_name].filter(Boolean).join(" / ");
  const od = oOutDate(r);
  let x = `<div class="sheetwrap" onclick="if(event.target===this)oClose()"><div class="osheet">
    <div class="row"><span class="badge ${classify(kind)}">${esc(kind)}</span>
      <span class="id-text">ID: ${r.part?.part_id ?? ""}</span>
      <button class="btn mini" style="margin-left:auto;" onclick="oClose()">×</button></div>
    <p class="name" style="font-size:17px;">${esc(r.part?.part_name || "")}</p>
    ${r.part?.model_number ? `<p class="model">型式: ${esc(r.part.model_number)}</p>` : ""}
    <p class="maker">メーカー: ${esc(r.part?.maker?.maker_name || "")}</p>
    <div>
      <div class="kv"><span>状態</span><span><b>${st[1]}</b>${ld ? ` <b style="color:var(--red-fg);">(${ld}日遅れ)</b>` : ""}</span></div>
      <div class="kv"><span>出庫</span><span>${mdate(od)}　${esc(r.source?.staff?.user_name || "")}さん</span></div>
      <div class="kv"><span>使用設備</span><span>${where ? esc(where) : "未入力"}</span></div>
      <div class="kv"><span>発注点 / 発注量</span><span>${r.part?.order_point ?? "-"} / ${r.order_quantity}</span></div>
      <div class="kv"><span>現在の在庫</span><span>新品 ${r.part?.new_stock_qty ?? 0}個 / 中古 ${r.part?.used_stock_qty ?? 0}個</span></div>
      ${r.status === "発注済み" ? `<div class="kv"><span>発注システムのID</span><span>${esc(r.external_order_id || "")}</span></div>
        <div class="kv"><span>入荷</span><span>${r.received_at ? mdate(new Date(r.received_at)) : ""}</span></div>` : ""}
    </div>`;
  if(r.status === "未発注" || r.status === "発注中"){
    x += `<div class="fld"><label>発注システムのID${r.status === "未発注" ? "(入力すると「発注中」になります)" : ""}</label>
        <input type="text" placeholder="例: PO-24060" value="${esc(o.idv)}" oninput="oChkId(this.value)"></div>
      <div class="fld"><label>納期</label><input type="date" value="${esc(o.duev)}" onchange="o.duev=this.value"></div>
      <button id="oGo" class="btn primary" style="width:100%;margin-top:14px;" ${o.idv.trim() ? "" : "disabled"} onclick="oStart()">${r.status === "未発注" ? "発注中にする" : "ID・納期を更新する"}</button>`;
  }
  if(r.status === "発注中"){
    x += `<button class="btn primary" style="width:100%;margin-top:10px;" onclick="oReceive()">入荷した(発注済みにする)</button>`;
  }
  if(o.msg) x += `<p class="${o.msgOk ? "okmsg" : "warn"}">${esc(o.msg)}</p>`;
  return x + "</div></div>";
}
function renderOrders(){
  if(route !== "order") return;
  const rows = o.rows.filter(r => r.status !== "発注済み" || (r.received_at && new Date(r.received_at) >= dayStart(-30)));
  const cnt = s => rows.filter(r => r.status === s).length;
  const late = rows.filter(r => oLate(r)).sort((a, b) => oLate(b) - oLate(a));
  const showLate = (o.filter === "all" || o.filter === "発注中") && late.length;
  const rest = rows.filter(r => !oLate(r) && (o.filter === "all" || r.status === o.filter))
    .sort((a, b) => oOutDate(b) - oOutDate(a));
  const lab = { all:"すべて", "未発注":"未発注", "発注中":"発注中", "発注済み":"発注済み(直近30日)" };
  let x = `<h1>発注管理</h1><p class="muted">出庫した部品の発注状況</p>
    <div class="chiprow">${[["all","すべて",rows.length],["未発注","未発注",cnt("未発注")],["発注中","発注中",cnt("発注中")],["発注済み","発注済み",cnt("発注済み")]]
      .map(v => `<button class="chip ${o.filter === v[0] ? "on" : ""}" onclick="oSetFilter('${v[0]}')">${v[1]} ${v[2]}</button>`).join("")}</div>`;
  if(o.msg && !o.sel) x += `<p class="${o.msgOk ? "okmsg" : "warn"}">${esc(o.msg)}</p>`;
  if(o.loading) x += `<p class="status">読み込み中…</p>`;
  else if(o.error) x += `<p class="status">読み込みに失敗しました。<br>${esc(o.error)}</p>`;
  else{
    if(showLate) x += `<div class="osec"><b style="color:var(--red-fg);">納期遅れ ${late.length}件</b><span class="muted">早めの確認がおすすめ</span></div>
      <div class="ogrid2">${late.map(oTile).join("")}</div>`;
    x += `<div class="osec"><b>${lab[o.filter]}</b><span class="muted">${rest.length}件 / 出庫が新しい順</span></div>
      <div class="ogrid3">${rest.map(oTile).join("")}</div>`;
    if(!rest.length && !showLate) x += `<p class="status">発注が必要な部品は、今はありません</p>`;
  }
  mainEl().innerHTML = x + (o.sel ? oSheetHtml() : "");
}

/* ===== 起動 ===== */
(async function start(){
  await loadMe();
  go();
})();
</script>
